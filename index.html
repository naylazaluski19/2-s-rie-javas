<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineDev - Catálogo Avançado de Mídias</title>
   <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">
    <h1>🎬 CineDev</h1>
    <h2>Catálogo Avançado de Mídias</h2>

    <div id="mensagemErro"></div>

    <form id="midiaForm">
        <select id="selectTipo">
            <option value="filme">Filme</option>
            <option value="serie">Série</option>
        </select>
        <input type="text" id="inputTitulo" placeholder="Título da Mídia" required>
        <input type="number" id="inputAno" placeholder="Ano de Lançamento" required>
        <input type="text" id="inputGenero" placeholder="Gênero (ex: Ação, Sci-Fi)" required>
        <input type="text" id="inputTrailer" placeholder="URL do Trailer (https://...)" required>
        <input type="number" id="inputTemporadas" placeholder="Número de Temporadas" style="display: none;">
       
        <button type="submit" id="btnCadastrar">Cadastrar no Catálogo</button>
    </form>

    <hr>

    <h2>Filmes & Séries Cadastrados</h2>
    <div id="containerCatalogo" class="grid-catalogo"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
